name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Compile and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Runs the crypto, protocol, introduction and model tests, plus
      # compile_check_test.dart which forces the whole app graph — every screen
      # and both platforms' wiring — to type-check.
      - run: flutter test
